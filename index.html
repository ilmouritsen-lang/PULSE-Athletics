<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <title>PULSE Athletics</title>
    <link rel="stylesheet" href="css.css/pulse.css">
</head>

<body>
    <header>
        <!-- Logo til header der skal være i venstre side -->
         <article class="pulse-logo-oeverst">
            <!-- Har bare sat et random logo ind her (skal ændres) -->
            <img src="images/logo.png" alt="pulse logo">
        </article>

        <!-- Søg, profil, kurv, menu -->
        <section class="ikoner-oeverst">

            <!-- Søge ikon -->
            <img src="images/soeg.png" alt="søge ikon" class="soegeikon">

            <!-- profil ikon -->
            <img src="images/profil.png" alt="profil ikon">

            <!-- indkøbskurv ikon -->
            <img src="images/kurv.png" alt="kruv ikon">

            <!-- burgermenu ikon -->
            <img src="images/menu.png" alt="hambruger ikon">

        </section>
    </header>

    <main>
        <!-- HELE OMRÅDET MED HERO BILLEDERNE -->
        <section class="hero">
            
            <!-- Det første billede -->
            <!-- id bruges som destination for pilenes links -->
            <div class="slide" id="slide1">

                <!-- Selve produktbilledet -->
                <img src="images/grå-forfra.png" alt="gråt ur forfra">

                <!-- Link til det forrige billede -->
                <!-- Fra slide1 går venstre pil til det sidste slide -->
                <a class="venstre-pil" href="#slide5">←</a>

                <!-- link til næste billede -->
                <a class="hoejre-pil" href="#slide2">→</a>

            </div>

            <!-- Det andet billede -->
            <div class="slide" id="slide2">

                <!-- produktbillede -->
                <img src="images/grå-siden.png" alt="gråt ur fra siden">

                <!-- link til forrige billede -->
                 <a class="venstre-pil" href="#slide1">←</a>

                 <!-- link til næste billede -->
                 <a class="hoejre-pil" href="#slide3">→</a>

            </div>

             <!-- Det tredje billede -->
            <div class="slide" id="slide3">

                <!-- produktbillede -->
                <img src="images/grå-bagside.png" alt="gråt urs bagside">

                <!-- link til forrige billede -->
                 <a class="venstre-pil" href="#slide2">←</a>

                 <!-- link til næste billede -->
                 <a class="hoejre-pil" href="#slide4">→</a>

            </div>

              <!-- Det fjerde billede -->
            <div class="slide" id="slide4">

                <!-- produktbillede -->
                <img src="images/grå-bagfra.png" alt="gråt ur bagfra">

                <!-- link til forrige billede -->
                 <a class="venstre-pil" href="#slide3">←</a>

                 <!-- link til næste billede -->
                 <a class="hoejre-pil" href="#slide5">→</a>

            </div>

                 <!-- Det femte billede -->
            <div class="slide" id="slide5">

                <!-- produktbillede -->
                <img src="images/grå-sensor.png" alt="gråt urs sensor">

                <!-- link til forrige billede -->
                 <a class="venstre-pil" href="#slide4">←</a>

                 <!-- link til næste billede -->
                 <a class="hoejre-pil" href="#slide1">→</a>

            </div>

        </section>

        <!-- PRODUKTBESKRIVELSE med navn, varenummer, pris, trustpilot, størrelser, farver, læg i kurv knap og leveringstid -->
         <section class="produktbeskrivelse">

            <!-- laver en produktgruppe til hver gruppering, fordi vi så kan bestemme afstanden for hver gruppe -->
            
            <!-- navn - gruppe -->
            <div class="produktgruppe">
                <!-- Produktnavn -->
                <h1>Produktnavn</h1>
                <!-- varenummer -->
                <h6>Varenummer: 00010034567</h6>
            </div>
        
            <!-- pris - gruppe -->
             <div class="produktgruppe">
                <!-- pris -->
                <h2>1.299,00 kr</h2>
                <!-- trustpilot -->
                <img src="images/trustpilot.png" alt="trustpilot stjerner">
             </div>
            
            <!-- størrelse - gruppe -->
             <div class="produktgruppe"> 
                <!-- størrelser -->
                <h4>Størrelser</h4>
                <!-- boksen hvor der står one size -->
                <div class="boks-one-size">One size</div>
             </div>

            <!-- farve - gruppe -->
             <div class="produktgruppe">
                <!-- farver -->
                <h4>Farver</h4>

                <!-- her laver vi html for de tre farvet cirkler, der skal blot være en overordnet class og en class der difinere hver cirkel -->
                <div class="farve-cirkler">
                    <div class="cirkel-sort"></div>
                    <div class="cirkel-blå"></div>
                    <div class="cirkel-grøn"></div>
                </div>
             </div>

            <!-- købe knap - gruppe -->
             <div class="produktgruppe">
                <!-- læg i kurv knap -->
                <button type="button" class="kurv-knap">Læg i kurv</button>
                <!-- leveringstid -->
                <h6>Leveringstid er 1-2 uger.</h6>
             </div>

         </section>

        <!-- DE FIRE BILLEDER fra chat ligger her, hvor teksten er en "knap" der kan hover og gøre cusor til pointer-->
        <section class="billeder">
            
            <!-- Her ligger det første billeder der viser "10 dages batteri" -->
            <div class="batteri">
                <!-- Her er selve billedet sat ind -->
                <img src="images/batteri.png" alt="mand med armbånd med 10 dages batteri">

                <!-- Her er "tekst-knappen"-->
                <button type="button" class="batteri-billedetekst">
                    10 dages batteri
                </button>
            </div>


            <!-- Her ligger det andet billede af "søvn" -->
            <div class="søvn">
                <!-- Her ligget selve billedet -->
                <img src="images/søvn.png" alt="mand der sover med armbånd">

                <!-- Her er "tekst-knappen" -->
                <button type="button" class="søvn-billedetekst">
                    Søvn
                </button>
            </div>


            <!-- Her ligger det tredje billede af "træning" -->
            <div class="træning">
                <!-- Her ligget selve billedet -->
                <img src="images/træning.png" alt="mand der løber med armbånd på">

            <!-- Her er "tekst-knappen" -->
             <button type="button" class="træning-billedetekst">
                Træning
             </button>
             </div>


             <!-- Her ligger det fjerde billede af "sundhed" -->
            <div class="sundhed">
                <!-- Her ligget selve billedet -->
                <img src="images/sundhed.png" alt="mand der mediterer">

                <!-- Her er "tekst-knappen" -->
                 <button type="button" class="sundhed-billedetekst">
                    Sundhed
                 </button>
            </div>

        </section>
    </main>

    <footer>

        <!-- her er de tre knapper i en gruppe -->
        <div class="footer-knapper">
            <!-- Kundeservice -->
            <button type="button" class="Kundeservice-knap">Kundeservice</button>

            <!-- Om os -->
            <button type="button" class="om-os-knap">Om os</button>

            <!-- Retur / reklamation -->
            <button type="button" class="retur-reklamation-knap">Retur/reklamation</button>

        </div>

        <!-- her er knapperne til Sociale medier -->
        <div class="sociale-medier">
            <button type="button" class="instagram">
                <img src="images/instagram.png" alt="instagram knap">
            </button>
        
            <button type="button" class="facebook">
                <img src="images/facebook.png" alt="facebook knap">
            </button>

            <button type="button" class="linkedin">
                <img src="images/linkedin.png" alt="linkedin knap">
            </button>
        </div>

    </footer>

</body>

</html>
